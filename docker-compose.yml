services:
  ghostwriter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghostwriter-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
      - path: .env.local
        required: false
