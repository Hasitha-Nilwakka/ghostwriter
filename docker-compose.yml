services:
  ghostwriter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghostwriter-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_ENDPOINT_ID=${RUNPOD_ENDPOINT_ID:-}
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
